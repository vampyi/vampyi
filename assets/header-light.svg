<svg xmlns="http://www.w3.org/2000/svg" width="900" height="280" viewBox="0 0 900 280" role="img" aria-label="DEEPTHI DUBASI — data engineer by day">
  <title>DEEPTHI DUBASI — data engineer</title>
  <defs>
    <radialGradient id="w0" gradientUnits="userSpaceOnUse" cx="54.0" cy="-28.0" r="486"
      gradientTransform="translate(54.0 -28.0) scale(1 0.449) translate(-54.0 28.0)">
      <stop offset="0" stop-color="rgb(242,196,212)" stop-opacity="0.85"/>
      <stop offset="1" stop-color="rgb(242,196,212)" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="w1" gradientUnits="userSpaceOnUse" cx="900.0" cy="308.0" r="432"
      gradientTransform="translate(900.0 308.0) scale(1 0.467) translate(-900.0 -308.0)">
      <stop offset="0" stop-color="rgb(214,196,235)" stop-opacity="0.7"/>
      <stop offset="1" stop-color="rgb(214,196,235)" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="w2" gradientUnits="userSpaceOnUse" cx="738.0" cy="-56.0" r="324"
      gradientTransform="translate(738.0 -56.0) scale(1 0.467) translate(-738.0 56.0)">
      <stop offset="0" stop-color="rgb(255,230,240)" stop-opacity="0.9"/>
      <stop offset="1" stop-color="rgb(255,230,240)" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="panel">
      <rect width="900" height="280" rx="14"/>
    </clipPath>
    <clipPath id="c0">
      <rect class="clip clip0" x="337.09" y="164" width="225.83" height="37"/>
    </clipPath>
    <clipPath id="c1">
      <rect class="clip clip1" x="340.95" y="164" width="0" height="37"/>
    </clipPath>
    <clipPath id="c2">
      <rect class="clip clip2" x="313.08" y="164" width="0" height="37"/>
    </clipPath>
  </defs>

  <style>
    @font-face {
      font-family:"BodoniName";
      src:url(data:font/woff2;base64,) format("woff2");
    }
    @font-face {
      font-family:"BodoniSub";
      src:url(data:font/woff2;base64,) format("woff2");
    }
    .name {
      font-family:"BodoniName",Didot,"Hoefler Text",Garamond,Georgia,serif;
      font-size:50px; letter-spacing:0.17em; fill:#3F2639;
      text-anchor:middle; dominant-baseline:auto;
    }
    .sub {
      font-family:"BodoniSub",Didot,"Hoefler Text",Georgia,serif;
      font-size:23px; letter-spacing:0.035em; fill:#C4587C;
      text-anchor:middle;
    }
    .meta {
      font-family:"BodoniName",Didot,Georgia,serif;
      font-size:11px; letter-spacing:0.34em; fill:#8E6E86;
      text-anchor:middle;
    }
    .hair { fill:#E0B9CB; }
    .caret { fill:#C4587C; }

    .clip0 { animation:clip0 12.0s infinite; }
    .clip1 { animation:clip1 12.0s infinite; }
    .clip2 { animation:clip2 12.0s infinite; }
    .caret { animation:caretx 12.0s infinite, blink 1.06s steps(1,end) infinite; }

  @keyframes clip0 {
    0% { width:0; animation-timing-function:steps(20,end); }
    10.8333% { width:225.83px; animation-timing-function:step-end; }
    28.3333% { width:225.83px; animation-timing-function:steps(20,end); }
    33.3333% { width:0; animation-timing-function:step-end; }
    100% { width:0; }
  }
  @keyframes clip1 {
    0% { width:0; animation-timing-function:step-end; }
    33.3333% { width:0; animation-timing-function:steps(20,end); }
    44.1667% { width:218.11px; animation-timing-function:step-end; }
    61.6667% { width:218.11px; animation-timing-function:steps(20,end); }
    66.6667% { width:0; animation-timing-function:step-end; }
    100% { width:0; }
  }
  @keyframes clip2 {
    0% { width:0; animation-timing-function:step-end; }
    66.6667% { width:0; animation-timing-function:steps(26,end); }
    77.5% { width:273.85px; animation-timing-function:step-end; }
    95.0% { width:273.85px; animation-timing-function:steps(26,end); }
    100.0% { width:0; animation-timing-function:step-end; }
  }
  @keyframes caretx {
    0.0% { x:337.09px; animation-timing-function:steps(20,end); }
    10.8333% { x:562.91px; animation-timing-function:step-end; }
    28.3333% { x:562.91px; animation-timing-function:steps(20,end); }
    33.3333% { x:340.95px; animation-timing-function:steps(20,end); }
    33.3333% { x:340.95px; animation-timing-function:steps(20,end); }
    44.1667% { x:559.05px; animation-timing-function:step-end; }
    61.6667% { x:559.05px; animation-timing-function:steps(20,end); }
    66.6667% { x:313.08px; animation-timing-function:steps(26,end); }
    66.6667% { x:313.08px; animation-timing-function:steps(26,end); }
    77.5% { x:586.92px; animation-timing-function:step-end; }
    95.0% { x:586.92px; animation-timing-function:steps(26,end); }
    100% { x:337.09px; }
  }
  @keyframes blink { 0%,50% { opacity:1; } 50.01%,100% { opacity:0; } }

    @media (prefers-reduced-motion:reduce) {
      .clip0,.clip1,.clip2,.caret { animation:none; }
    }
  </style>

  <g clip-path="url(#panel)">
    <rect width="900" height="280" fill="#FFF8FA"/>
    <rect width="900" height="280" fill="url(#w0)"/>
    <rect width="900" height="280" fill="url(#w1)"/>
    <rect width="900" height="280" fill="url(#w2)"/>
  </g>

  <rect class="hair" x="144.40" y="62" width="611.20" height="1"/>
  <text class="name" x="450.0" y="125">DEEPTHI DUBASI</text>
  <rect class="hair" x="144.40" y="149" width="611.20" height="1"/>

    <g clip-path="url(#c0)">
      <text class="sub" x="450.0" y="187">data engineer by day</text>
    </g>
    <g clip-path="url(#c1)">
      <text class="sub" x="450.0" y="187">ai enthusiast always</text>
    </g>
    <g clip-path="url(#c2)">
      <text class="sub" x="450.0" y="187">building things that scale</text>
    </g>
  <rect class="caret" x="562.91" y="169.1" width="1.5" height="20.2" rx="0.75"/>

  <text class="meta" x="450.0" y="231">BENGALURU, INDIA</text>
</svg>
